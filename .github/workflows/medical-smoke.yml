name: Medical Search Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/medical-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test geocoding and nearby care
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, sys

          endpoint = "https://cxpsjlevzmodjpwokwyl.supabase.co/functions/v1/medical-location-search"

          def post(payload, timeout=30):
              body = json.dumps(payload).encode()
              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={"Content-Type":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  data = json.loads(resp.read().decode())
                  print(json.dumps(data, ensure_ascii=False)[:3000])
                  return data

          ping = post({"mode":"ping"})
          assert ping.get("ok") is True, ping

          geo = post({"mode":"geocode","query":"Chandigarh"})
          results = geo.get("results") or []
          assert results, "Geocoding returned no locations"
          lat, lon = results[0]["lat"], results[0]["lon"]

          nearby = post({"mode":"nearby","lat":lat,"lon":lon,"radiusKm":5}, timeout=35)
          places = nearby.get("elements") or []
          print("Edge nearby mapped healthcare options:", len(places))

          if not places:
              import urllib.parse
              query = f'''[out:json][timeout:10];(
                nwr["amenity"~"^(hospital|clinic|doctors|pharmacy)$"](around:5000,{lat},{lon});
                nwr["healthcare"~"^(hospital|clinic|doctor|pharmacy|physiotherapist|psychotherapist|laboratory|audiologist|rehabilitation)$"](around:5000,{lat},{lon});
              );out center tags 80;'''
              body = urllib.parse.urlencode({"data": query}).encode()
              for overpass in [
                  "https://overpass.kumi.systems/api/interpreter",
                  "https://overpass-api.de/api/interpreter",
              ]:
                  try:
                      req = urllib.request.Request(
                          overpass,
                          data=body,
                          headers={
                              "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8",
                              "User-Agent":"ANTAR-healthcare-smoke/1.0 (GitHub Actions; healthcare search test)",
                              "Accept":"application/json",
                          },
                          method="POST",
                      )
                      with urllib.request.urlopen(req, timeout=25) as resp:
                          direct = json.loads(resp.read().decode())
                      places = direct.get("elements") or []
                      print("Direct Overpass options:", overpass, len(places))
                      if places:
                          break
                  except Exception as exc:
                      print("Direct Overpass failed:", overpass, repr(exc))

          assert places, "Nearby healthcare search returned no options from any provider"
          PY
